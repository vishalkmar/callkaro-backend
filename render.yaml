# Render Blueprint: New > Blueprint > pick this repo. Secrets marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: callkaro-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL # Neon pooled connection string (contains sslmode=require)
        sync: false
      - key: PUBLIC_BASE_URL # https://<your-service>.onrender.com
        sync: false
      # 64+ random characters each (the server refuses shorter ones). Generate locally:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: CallKaro
